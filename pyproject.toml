[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ableton-strip-silence"
version = "0.1.0"
description = "Automate Ableton Live export renaming, silence stripping, and ALS timeline restoration."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "defusedxml>=0.7.1",
  "numpy>=1.24.0"
]
authors = [
  { name = "GitHub Copilot" }
]
keywords = ["ableton", "strip-silence", "audio", "als", "wav"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
ableton-strip-silence = "ableton_strip_silence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
